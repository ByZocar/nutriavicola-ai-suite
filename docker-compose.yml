# Levanta el extra completo en local: API + dashboard.
# Uso: docker compose up --build

services:
  api:
    build: .
    command: >
      uvicorn nutria_ai.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app/src

  dashboard:
    build: .
    command: >
      streamlit run src/nutria_ai/dashboard/app.py
      --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      PYTHONPATH: /app/src
    depends_on:
      - api
