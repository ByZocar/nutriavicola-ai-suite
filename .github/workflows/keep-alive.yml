# Mantiene despierta la API en Render (plan free) haciendo ping a /salud.
# Render duerme el servicio tras ~15 min de inactividad; este cron lo evita.
name: Keep Alive

on:
  schedule:
    # Cada 10 minutos (la hora real puede variar unos minutos en GitHub Actions)
    - cron: "*/10 * * * *"
  # Permite ejecutarlo manualmente desde la pestana Actions
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar la API
        run: |
          echo "Haciendo ping a la API para mantenerla caliente..."
          codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
            https://nutriavicola-api.onrender.com/salud)
          echo "Respuesta HTTP: $codigo"
          if [ "$codigo" != "200" ]; then
            echo "Advertencia: la API no respondio 200 (puede estar despertando)."
          fi
